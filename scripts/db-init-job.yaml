apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
  namespace: app-patient-service
data:
  db-init.sql: |
    -- Schema definitions
    IF NOT EXISTS (SELECT * FROM sys.schemas WHERE name = 'app')
    BEGIN
        EXEC('CREATE SCHEMA [app]');
    END
    GO

    IF NOT EXISTS (SELECT * FROM sys.schemas WHERE name = 'fin')
    BEGIN
        EXEC('CREATE SCHEMA [fin]');
    END
    GO

    -- 1. Patients Table
    IF NOT EXISTS (SELECT * FROM sysobjects WHERE name='Patients' and xtype='U')
    BEGIN
        CREATE TABLE dbo.Patients (
            Id INT IDENTITY(1,1) PRIMARY KEY,
            FirstName NVARCHAR(100) NOT NULL,
            LastName NVARCHAR(100) NOT NULL,
            Email NVARCHAR(255) NOT NULL,
            Phone NVARCHAR(50),
            DateOfBirth DATE NOT NULL,
            CreatedAt DATETIME DEFAULT GETUTCDATE()
        );
    END
    GO

    -- 2. Appointments Table
    IF NOT EXISTS (SELECT * FROM sysobjects WHERE name='Appointments' and xtype='U')
    BEGIN
        CREATE TABLE app.Appointments (
            Id INT IDENTITY(1,1) PRIMARY KEY,
            PatientId INT NOT NULL,
            DoctorId INT NOT NULL,
            AppointmentTime DATETIME NOT NULL,
            Status NVARCHAR(50) DEFAULT 'Scheduled',
            Notes NVARCHAR(MAX),
            CreatedAt DATETIME DEFAULT GETUTCDATE(),
            CONSTRAINT FK_Appointments_Patients FOREIGN KEY (PatientId) REFERENCES dbo.Patients(Id)
        );
    END
    GO

    -- 3. Invoices Table
    IF NOT EXISTS (SELECT * FROM sysobjects WHERE name='Invoices' and xtype='U')
    BEGIN
        CREATE TABLE fin.Invoices (
            Id INT IDENTITY(1,1) PRIMARY KEY,
            PatientId INT NOT NULL,
            AppointmentId INT NOT NULL,
            Amount DECIMAL(18,2) NOT NULL,
            Status NVARCHAR(50) DEFAULT 'Pending',
            DueDate DATE NOT NULL,
            CreatedAt DATETIME DEFAULT GETUTCDATE(),
            CONSTRAINT FK_Invoices_Patients FOREIGN KEY (PatientId) REFERENCES dbo.Patients(Id),
            CONSTRAINT FK_Invoices_Appointments FOREIGN KEY (AppointmentId) REFERENCES app.Appointments(Id)
        );
    END
    GO
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: app-patient-service
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: patient-service-sa
      restartPolicy: Never
      containers:
      - name: sqlcmd
        image: mcr.microsoft.com/mssql-tools
        command:
        - /bin/bash
        - -c
        - |
          echo "Extracting DB info from connection string..."
          # Connection string format: Server=tcp:sql-server.database.windows.net,1433;Database=sqldb;User ID=sqladmin;Password=secret;
          CS=$(cat /mnt/secrets-store/db-connection-string)
          SERVER=$(echo "$CS" | grep -oP 'Server=tcp:\K[^,;]*')
          USER=$(echo "$CS" | grep -oP 'User ID=\K[^;]*')
          PASS=$(echo "$CS" | grep -oP 'Password=\K[^;]*')
          DB=$(echo "$CS" | grep -oP 'Database=\K[^;]*')
          
          echo "Executing SQL script..."
          /opt/mssql-tools/bin/sqlcmd -S "$SERVER" -U "$USER" -P "$PASS" -d "$DB" -i /scripts/db-init.sql
        volumeMounts:
        - name: secrets-store01-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
        - name: script-volume
          mountPath: "/scripts"
      volumes:
      - name: secrets-store01-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "patient-service-spc"
      - name: script-volume
        configMap:
          name: db-init-script

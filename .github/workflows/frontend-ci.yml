name: Build and Push Frontend

on:
  push:
    branches: [ "feature/phase1-core-infra", "main" ]
    paths:
      - 'services/frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write   # Needed to commit values.yaml tag update back

env:
  ACR_NAME: acrhealthsyncdev
  IMAGE_NAME: frontend
  CHART_DIR: platform/charts/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag from Commit SHA
        id: vars
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (linux/amd64 for AKS)
        working-directory: services/frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Image to ACR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Update Helm Chart Image Tag (GitOps)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ env.IMAGE_TAG }}\"/" ${{ env.CHART_DIR }}/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHART_DIR }}/values.yaml
          git commit -m "ci: Update frontend image tag to ${{ env.IMAGE_TAG }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Trigger ArgoCD Sync
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "ArgoCD will auto-detect the values.yaml change and sync the frontend application."
          echo "Image deployed: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

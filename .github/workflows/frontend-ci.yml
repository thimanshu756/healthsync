name: Build and Push Frontend

on:
  push:
    branches: [ "feature/phase1-core-infra", "main" ]
    paths:
      - 'services/frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      run: az acr login -n acrhealthsyncdev

    - name: Build and Push Docker image
      run: |
        cd services/frontend
        docker build -t acrhealthsyncdev.azurecr.io/frontend:latest .
        docker push acrhealthsyncdev.azurecr.io/frontend:latest

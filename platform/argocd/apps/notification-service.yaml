apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/thimanshu756/healthsync.git'
    path: platform/charts/notification-service
    targetRevision: feature/phase1-core-infra
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app-notification-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

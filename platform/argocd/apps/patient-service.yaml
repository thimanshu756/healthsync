apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: patient-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/thimanshu756/healthsync.git'
    targetRevision: feature/phase1-core-infra
    path: platform/charts/patient-service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app-patient-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

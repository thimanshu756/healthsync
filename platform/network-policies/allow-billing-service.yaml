---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-billing-service
  namespace: app-billing-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  policyTypes:
  - Ingress
  - Egress
  # No HTTP ingress needed, reads from Service Bus topics
  egress:
  # Allow DNS resolution
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow Azure SQL (1433)
  - ports:
    - protocol: TCP
      port: 1433
  # Allow Service Bus (5671, 443)
  - ports:
    - protocol: TCP
      port: 5671
    - protocol: TCP
      port: 443

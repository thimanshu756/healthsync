apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ai-insights-service-spc
  namespace: {{ .Release.Namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ index .Values.serviceAccount.annotations "azure.workload.identity/client-id" | quote }}
    keyvaultName: {{ .Values.keyvault.name | quote }}
    tenantId: {{ .Values.keyvault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: servicebus-connection-string
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: ai-insights-secrets
      type: Opaque
      data:
        - objectName: servicebus-connection-string
          key: SERVICEBUS_CONNECTION_STRING

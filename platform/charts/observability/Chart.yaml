apiVersion: v2
name: observability
description: HealthSync AI Observability Stack — Prometheus, Grafana, Loki, Tempo
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: "61.2.0"
    repository: https://prometheus-community.github.io/helm-charts
    alias: prometheus
  - name: loki
    version: "6.6.3"
    repository: https://grafana.github.io/helm-charts
    alias: loki
  - name: tempo
    version: "1.9.0"
    repository: https://grafana.github.io/helm-charts
    alias: tempo

apiVersion: v1
kind: ConfigMap
metadata:
  name: healthsync-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  healthsync.json: |
    {
      "title": "HealthSync AI — Platform Overview",
      "uid": "healthsync-overview",
      "tags": ["healthsync", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1,
          "title": "Pod Count by Namespace",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "count(kube_pod_info{namespace=~\"app-.*|frontend|ingress-nginx\"}) by (namespace)", "legendFormat": "{{ "{{" }}namespace{{ "}}" }}"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}}
        },
        {
          "id": 2,
          "title": "CPU Usage — App Pods",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"app-.*|frontend\",container!=\"\"}[5m])) by (namespace)", "legendFormat": "{{ "{{" }}namespace{{ "}}" }}"}]
        },
        {
          "id": 3,
          "title": "Memory Usage — App Pods",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=~\"app-.*|frontend\",container!=\"\"}) by (namespace)", "legendFormat": "{{ "{{" }}namespace{{ "}}" }}"}]
        },
        {
          "id": 4,
          "title": "HTTP Requests (NGINX Ingress)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{"expr": "sum(rate(nginx_ingress_controller_requests[5m])) by (ingress,service)", "legendFormat": "{{ "{{" }}service{{ "}}" }}"}]
        },
        {
          "id": 5,
          "title": "KEDA Scaled Replicas",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "kube_deployment_spec_replicas{namespace=\"app-notification-service\"}", "legendFormat": "notification-worker"}]
        },
        {
          "id": 6,
          "title": "Node CPU %",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [{"expr": "100 - (avg by(node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{ "{{" }}node{{ "}}" }}"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "orientation": "auto"}
        }
      ],
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"}
    }

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "patient-service.fullname" . }}-spc
spec:
  provider: azure
  secretObjects:
    - secretName: sql-secret
      type: Opaque
      data:
        - key: DB_CONNECTION_STRING
          objectName: {{ .Values.keyvault.sqlSecretName }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.serviceAccount.annotations."azure.workload.identity/client-id" | quote }}
    keyvaultName: {{ .Values.keyvault.name | quote }}
    tenantId: {{ .Values.keyvault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyvault.sqlSecretName }}
          objectType: secret
          objectVersion: ""
